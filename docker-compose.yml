# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Local development infrastructure
#
# WHY this file exists:
#   Every developer gets an identical environment with one command: `docker compose up -d`
#   No "works on my machine" problems.
#
# What's here (Phase 0 — infrastructure only, no app containers yet):
#   - PostgreSQL + pgvector
#   - Redis
#   - MinIO (S3-compatible local object storage)
#   - Prometheus (metrics collection)
#   - Grafana (dashboards)
#   - Jaeger (distributed tracing — OpenTelemetry backend)
#
# App containers (API, worker) are added in Phase 10 after Dockerfiles are written.
#
# Usage:
#   docker compose up -d           # start all infra
#   docker compose ps              # check status
#   docker compose logs postgres   # check a specific service
#   docker compose down            # stop all (data persisted in volumes)
#   docker compose down -v         # stop all + DELETE data volumes (fresh start)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL + pgvector ───────────────────────────────────────────────────
  # WHY pgvector image: the standard postgres image doesn't have the vector
  # extension. ankane/pgvector includes it pre-installed.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password   # local dev only — never use in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis ───────────────────────────────────────────────────────────────────
  # WHY Redis: caching, rate limiting, and job queue.
  # appendonly yes: persist data to disk (survives container restart).
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible local object storage) ──────────────────────────────
  # WHY MinIO: we use S3 in production but MinIO is API-compatible,
  # so the same boto3 code works locally without AWS credentials.
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # MinIO web console — open http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── Create default S3 bucket on MinIO startup ───────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: rag-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/rag-documents;
        echo 'Bucket rag-documents ready';
      "

  # ─── Prometheus (metrics collection) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"

  # ─── Grafana (dashboards) ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"    # open http://localhost:3001  (admin/admin on first login)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ─── Jaeger (distributed tracing — OpenTelemetry backend) ───────────────────
  # WHY: stores and visualizes traces from OpenTelemetry instrumentation.
  # Open http://localhost:16686 to see request traces.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: rag-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC (your app sends traces here)
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

# ─── Named volumes ────────────────────────────────────────────────────────────
# Named volumes persist data between container restarts.
# `docker compose down -v` deletes them (useful for a fresh start).
volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
