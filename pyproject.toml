[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-platform"
version = "0.1.0"
description = "Production-grade Retrieval-Augmented Generation platform"
readme = "README.md"
requires-python = ">=3.12"

# ─── Core API ─────────────────────────────────────────────────────────────────
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Settings & validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Async PostgreSQL driver
    "alembic>=1.13.0",          # Migrations
    "pgvector>=0.3.0",          # pgvector SQLAlchemy type
    # Cache & Queue
    "redis>=5.0.0",
    # Object storage
    "boto3>=1.35.0",            # S3-compatible
    # Auth
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # Password/API key hashing
    "python-multipart>=0.0.9",           # File uploads
    # LLM providers (Phase 1/2)
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "google-genai>=0.2.0",
    # Document parsing (Phase 4)
    "pypdf>=4.3.0",
    # HTTP client for external APIs
    "httpx>=0.27.0",
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",         # Structured logging
    # Utilities
    "tenacity>=9.0.0",           # Retries with backoff
    "numpy>=2.0.0",
]

[project.optional-dependencies]
# ─── Development & Quality ────────────────────────────────────────────────────
dev = [
    "ruff>=0.6.0",               # Linting + formatting (replaces flake8 + isort + black)
    "mypy>=1.11.0",              # Static type checking
    "pre-commit>=3.8.0",         # Git hooks
    "types-redis",
    "types-passlib",
]

# ─── Testing ─────────────────────────────────────────────────────────────────
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",             # AsyncClient for FastAPI tests
    "factory-boy>=3.3.0",        # Test data factories
    "faker>=28.0.0",
]

# ─── Evaluation (Phase 6) ─────────────────────────────────────────────────────
eval = [
    "ragas>=0.1.0",
]

# ─── Load testing (Phase 11) ─────────────────────────────────────────────────
load = [
    "locust>=2.31.0",
]

# ─────────────────────────────────────────────────────────────────────────────
# Tool configuration (all in one file — no separate .flake8, setup.cfg, etc.)
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "services", "packages", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # FastAPI Depends() in defaults is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]  # relax security + naming rules in tests

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=apps --cov=services --cov=packages --cov-report=term-missing"
markers = [
    "unit: fast, no external deps",
    "integration: requires DB and Redis",
    "security: tenant isolation and RBAC tests",
    "rag: full RAG pipeline quality tests",
    "slow: load and performance tests",
]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*"]
